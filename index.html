<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>OMR Tracker 2026-27</title>
<style>
:root{
  /* Dark-first "night console": deep ink ground, neon cyan/violet/amber accents, glass panels. */
  --bg:#06070d; --bg2:#0b0e1a;
  --surface:rgba(255,255,255,.055); --surface-solid:#11152a;
  --ink:#eef1ff; --muted:#8e96bb; --line:rgba(255,255,255,.10);
  --accent:#6ef3ff; --accent-2:#3b82f6; --accent-3:#1e40af;
  --good:#5cffb2; --warn:#ffc86b; --bad:#ff6f94;
  --chip:rgba(255,255,255,.06); --soft:rgba(255,255,255,.045); --glow:rgba(110,243,255,.45);
  --grad:linear-gradient(120deg,var(--accent),var(--accent-2) 55%,var(--accent-3));
  --f-display:"Space Grotesk","Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f0ff; --bg2:#ffffff; --surface:rgba(255,255,255,.78); --surface-solid:#ffffff;
  --ink:#1a1638; --muted:#6b6896; --line:rgba(26,22,56,.12);
  --accent:#0a8fa3; --accent-2:#2563eb; --accent-3:#1e3a8a;
  --good:#11805a; --warn:#a86200; --bad:#c42a52;
  --chip:rgba(26,22,56,.06); --soft:rgba(26,22,56,.04); --glow:rgba(37,99,235,.30); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.45 var(--f-body);overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 60%),
    radial-gradient(900px 500px at 110% 10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
/* cursor glow: follows the pointer */
body::before{content:"";position:fixed;left:0;top:0;width:200px;height:200px;border-radius:50%;pointer-events:none;z-index:0;
  transform:translate(calc(var(--mx,-999px) - 100px),calc(var(--my,-999px) - 100px));
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent) 0%,color-mix(in srgb,var(--accent-2) 14%,transparent) 35%,transparent 65%);
  filter:blur(3px);transition:transform .08s linear;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 75%);}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-block:22px 44px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font:700 34px/1.05 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--accent) 35%,transparent))}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
button{font:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .18s,box-shadow .25s,border-color .25s,background .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px var(--glow)}
.btn.primary{background:var(--grad);border-color:transparent;color:#06070d;font-weight:700;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.primary:hover{box-shadow:0 0 0 1px #fff inset,0 0 34px var(--glow);color:#06070d}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin:0 0 16px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 72%,transparent);backdrop-filter:blur(14px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .2s,box-shadow .25s,border-color .25s,color .2s}
.seg button:hover{transform:translateY(-3px) scale(1.03);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 22px var(--glow),0 0 34px color-mix(in srgb,var(--accent) 25%,transparent)}
.seg button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#06070d;font-weight:700;box-shadow:0 0 26px color-mix(in srgb,var(--accent) 50%,transparent)}
select,input[type=search],input[type=date],textarea{appearance:none;border:1px solid var(--line);background:var(--surface-solid,var(--surface));color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;min-width:0;max-width:100%;transition:box-shadow .25s,border-color .25s}
select{padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select:hover,input:hover,textarea:hover{border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),0 0 24px var(--glow)}
#dist{min-width:230px}
input[type=search]{flex:1 1 200px}
button:focus-visible,tr[tabindex]:focus-visible,th[tabindex]:focus-visible,.stage-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctx{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:14px 18px;margin-bottom:16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--accent-2) 12%,transparent));box-shadow:0 0 36px color-mix(in srgb,var(--accent) 18%,transparent)}
.ctx b{font:700 20px/1.2 var(--f-display);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0;backdrop-filter:blur(10px);overflow:hidden;transition:transform .25s,box-shadow .3s,border-color .3s}
.kpi::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:70%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 35%,transparent),transparent);opacity:0;transition:opacity .35s}
.kpi:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 40px -10px var(--glow),0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.kpi:hover::after{opacity:1}
.kpi .v{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere;background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 60%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.kpi.hi{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--accent) 22%,transparent)}
.kpi.hi .v{background:var(--grad);-webkit-background-clip:text;background-clip:text}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:16px}
.grid2.single{grid-template-columns:1fr}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;backdrop-filter:blur(10px)}
.card h2{font:700 17px/1.2 var(--f-display);margin:0 0 12px;letter-spacing:.01em}
.stage-row{display:grid;grid-template-columns:minmax(96px,132px) 1fr 52px;gap:10px;align-items:center;margin:5px 0;padding:7px 9px;border-radius:12px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:background .2s,box-shadow .25s,border-color .25s,transform .2s}
.stage-row:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 22px var(--glow);transform:translateX(4px)}
.stage-row.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 26px var(--glow)}
.stage-row .t{background:var(--chip);border-radius:999px;height:12px;overflow:hidden;box-shadow:inset 0 0 6px rgba(0,0,0,.3)}
.stage-row .t i{display:block;height:100%;background:var(--grad);border-radius:999px;box-shadow:0 0 12px var(--glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stage-row b{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:15px}
.stage-row .p{grid-column:2 / 4;font-size:11px;color:var(--muted);margin-top:-4px;text-align:left}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;user-select:none}
th .ar{color:var(--accent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .2s,box-shadow .25s}
tbody tr:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);box-shadow:inset 3px 0 0 var(--accent),inset 0 0 30px color-mix(in srgb,var(--accent) 6%,transparent)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--chip);border:1px solid var(--line);white-space:nowrap;transition:box-shadow .25s,transform .2s}
tbody tr:hover .pill,.pill:hover{transform:translateY(-1px);box-shadow:0 0 14px var(--glow)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.mid{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.low{background:color-mix(in srgb,var(--accent-3) 18%,transparent);color:var(--accent-3);border-color:color-mix(in srgb,var(--accent-3) 45%,transparent)}
.muted{color:var(--muted)}
.reg-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.reg-head h2{font:700 20px/1.2 var(--f-display);margin:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{position:relative;z-index:1;padding:14px 18px;border-radius:16px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent-3) 50%,transparent);margin-bottom:16px}
.foot{color:var(--muted);font-size:12px;margin-top:14px}
#reg-card{padding:0;overflow:hidden}
/* detail dialog */
dialog{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:22px;background:color-mix(in srgb,var(--bg2) 92%,transparent);color:var(--ink);padding:0;width:min(780px,calc(100% - 32px));max-height:90vh;margin:auto;box-shadow:0 30px 90px -20px rgba(0,0,0,.6),0 0 60px -10px var(--glow);backdrop-filter:blur(16px)}
dialog::backdrop{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(110,243,255,.10),rgba(4,5,12,.7) 60%)}
.dhead{position:sticky;top:0;background:color-mix(in srgb,var(--bg2) 90%,transparent);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;z-index:1;backdrop-filter:blur(12px)}
.dhead h3{font:700 24px/1.15 var(--f-display);margin:0 0 6px;text-wrap:balance;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dnav{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.dbody{padding:18px 20px 22px;display:grid;gap:18px}
.dsec h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;transition:box-shadow .25s,border-color .25s}
.fact:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 20px var(--glow)}
.fact .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fact .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere;font-family:var(--f-display)}
.fact .v.small{font-size:14px;font-weight:500;font-family:var(--f-body)}
.ms{display:grid;gap:0}
.ms-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:9px 8px;margin:0 -8px;border-radius:12px;border-bottom:1px solid var(--line);transition:background .2s,box-shadow .25s}
.ms-row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 22%,transparent)}
.ms-row:last-child{border-bottom:0}
.ms-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer;filter:drop-shadow(0 0 6px var(--glow))}
.ms-row label{cursor:pointer}
.ms-row input[type=date]{width:100%}
.ms-row .none{color:var(--muted);font-size:12px}
.ms-row.pend .nm{color:var(--muted)}
.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{width:100%;min-height:74px;resize:vertical}
.savebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.msg{font-size:13px;color:var(--muted)}
.msg.ok{color:var(--good);text-shadow:0 0 12px var(--good)} .msg.err{color:var(--bad);text-shadow:0 0 12px var(--bad)}
.missingpm{color:var(--bad);text-shadow:0 0 10px color-mix(in srgb,var(--bad) 60%,transparent)}
@media (max-width:520px){ dialog{width:calc(100% - 20px);max-height:94vh} .dhead h3{font-size:20px} .ms-row{grid-template-columns:26px minmax(0,1fr)} .ms-row input[type=date]{grid-column:2} h1{font-size:28px} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition:none!important;animation:none!important} body::before{display:none} }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>OMR Tracker 2026-27</h1>
      <div class="sub">All four states in one view · changes you save are shared with everyone who opens this page</div>
    </div>
    <button class="btn" id="theme" type="button">Dark mode</button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="bar" role="region" aria-label="Filters">
    <div class="seg" id="states" role="group" aria-label="State"></div>
    <select id="dist" aria-label="Filter by district"></select>
    <select id="pm" aria-label="Filter by PM"></select>
    <select id="stage" aria-label="Filter by stage"></select>
    <input id="q" type="search" placeholder="Search exam, program, district…" aria-label="Search">
    <button class="btn" id="reset" type="button">Reset</button>
  </div>

  <div class="ctx" id="ctx" hidden></div>
  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="grid2" id="analysis">
    <div class="card"><h2>Stage funnel</h2><div id="funnel"></div></div>
    <div class="card" id="stateCard"><h2>By state</h2><div class="tbl-wrap"><table id="stateTbl"></table></div></div>
  </section>

  <div class="reg-head"><h2>Exams</h2><span class="muted" id="count"></span></div>
  <div class="card" style="padding:0"><div class="tbl-wrap"><table id="reg"></table></div></div>
  <div class="foot">Click any exam to see its details and update its progress. Click a column heading to sort. Click a stage to filter by it.</div>
</div>

<dialog id="detail" aria-labelledby="dtitle">
  <div class="dhead">
    <div>
      <h3 id="dtitle"></h3>
      <div id="dsub" class="muted"></div>
    </div>
    <div class="dnav">
      <button class="btn" id="prev" type="button" aria-label="Previous exam">‹ Prev</button>
      <button class="btn" id="next" type="button" aria-label="Next exam">Next ›</button>
      <button class="btn" id="close" type="button" aria-label="Close">Close</button>
    </div>
  </div>
  <div class="dbody" id="dbody"></div>
</dialog>

<script>
const ORDER = ["Maharashtra","Chhattisgarh","Bihar","Madhya Pradesh"];
const STAGES = ["0 Planned","1 Exam Held","2 Scanned","3 Uploaded","4 Reading Done","5 Analysis Done","6 PPT Received"];
const TONE = {"6":"ok","5":"mid","4":"mid","3":"low","2":"low","1":"low","0":""};
const MILESTONES = [["examDate","Exam held"],["scanned","Scanning complete"],["uploaded","Upload complete"],["read","Reading complete"],["analysis","Analysis complete"],["ppt","Final PPT received"]];
const $ = s => document.querySelector(s);
const fmt = n => (n==null || n==="" || isNaN(n)) ? "—" : Number(n).toLocaleString("en-IN");
const pct = (a,b) => (b>0 ? (100*a/b).toFixed(1)+"%" : "—");
const fdate = s => { if(!s) return null; if(s==="Yes") return "Done (date not recorded)"; const d=new Date(s+"T00:00:00"); return isNaN(d)?s:d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = st => (st||"").slice(2);
const sum = (rows,k)=> rows.reduce((a,d)=>a+(Number(d[k])||0),0);
const todayISO = () => new Date().toISOString().slice(0,10);
const isDone = v => !!v;

let DATA = [];          // exams from the shared database, each with .id (document id)
let db = null;          // db namespace, null when this view cannot save or read shared data
let loaded = false;
let current = [];       // exams in the current register order
let dirty = false;
let openId = null;

const S = { st:"All", dist:"All", pm:"All", stage:"All", q:"", sort:"district", dir:1 };

function stageOf(d){
  if (d.ppt) return "6 PPT Received";
  if (d.analysis) return "5 Analysis Done";
  if (d.read) return "4 Reading Done";
  if (d.uploaded) return "3 Uploaded";
  if (d.scanned) return "2 Scanned";
  if (d.examDate) return "1 Exam Held";
  return "0 Planned";
}
function districtsByState(){
  const map = {}; for (const st of ORDER) map[st] = [];
  for (const d of DATA){ if(!d.district) continue; const arr = map[d.state]; if(arr && !arr.includes(d.district)) arr.push(d.district); }
  for (const st of ORDER) map[st].sort((a,b)=>a.localeCompare(b,"en",{numeric:true}));
  return map;
}
function stateOfDistrict(dn){ const d = DATA.find(x=>x.district===dn); return d ? d.state : null; }

function setNotice(text, kind){
  const n = $("#notice"); if(!text){ n.hidden=true; n.textContent=""; return; }
  n.hidden=false; n.textContent = text; n.dataset.kind = kind||"";
}

function init(){
  $("#states").innerHTML = ["All",...ORDER].map(s=>`<button type="button" data-s="${esc(s)}" aria-pressed="${s==="All"}">${s==="All"?"All states":esc(s)}</button>`).join("");
  $("#stage").innerHTML = `<option value="All">All stages</option>` + STAGES.map(s=>`<option value="${esc(s)}">${esc(label(s))}</option>`).join("");

  $("#states").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    S.st = b.dataset.s;
    if (S.dist !== "All" && S.st !== "All" && stateOfDistrict(S.dist) !== S.st) S.dist = "All";
    render();
  });
  $("#dist").addEventListener("change", e=>{
    S.dist = e.target.value;
    if (S.dist !== "All"){ const st = stateOfDistrict(S.dist); if (st) S.st = st; }
    render();
  });
  $("#pm").addEventListener("change", e=>{ S.pm=e.target.value; render(); });
  $("#stage").addEventListener("change", e=>{ S.stage=e.target.value; render(); });
  $("#q").addEventListener("input", e=>{ S.q=e.target.value.trim().toLowerCase(); render(); });
  $("#reset").addEventListener("click", ()=>{ Object.assign(S,{st:"All",dist:"All",pm:"All",stage:"All",q:""}); syncControls(); render(); });
  $("#ctx").addEventListener("click", e=>{ if(e.target.closest("button")){ S.dist="All"; render(); } });

  $("#funnel").addEventListener("click", e=>{
    const row=e.target.closest("[data-stage]"); if(!row) return;
    S.stage = S.stage === row.dataset.stage ? "All" : row.dataset.stage; render();
  });
  $("#funnel").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches("[data-stage]")){ e.preventDefault(); e.target.click(); } });

  $("#reg").addEventListener("click", e=>{
    const th=e.target.closest("th[data-k]"); if(th){ const k=th.dataset.k; S.dir = S.sort===k ? -S.dir : 1; S.sort=k; renderRegister(); return; }
    const tr=e.target.closest("tr[data-id]"); if(tr) openDetail(tr.dataset.id);
  });
  $("#reg").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches("tr[data-id]")){ e.preventDefault(); openDetail(e.target.dataset.id); } });

  const dlg=$("#detail");
  $("#close").addEventListener("click", ()=>closeDetail());
  dlg.addEventListener("click", e=>{ if(e.target===dlg) closeDetail(); });
  dlg.addEventListener("cancel", e=>{ if(dirty){ e.preventDefault(); blockNav(); } else { openId=null; } });
  $("#prev").addEventListener("click", ()=>step(-1));
  $("#next").addEventListener("click", ()=>step(1));
  document.addEventListener("keydown", e=>{
    if(!dlg.open || e.target.matches("input,textarea,select")) return;
    if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1);
  });

  const curTheme = () => document.documentElement.dataset.theme || "dark";
  const paintTheme = () => { $("#theme").textContent = curTheme()==="dark" ? "Light mode" : "Dark mode"; };
  $("#theme").addEventListener("click", ()=>{ document.documentElement.dataset.theme = curTheme()==="dark" ? "light" : "dark"; paintTheme(); });
  paintTheme();
  // cursor glow: track the pointer so the glow and dialog backdrop follow it
  const place = e => { const r=document.documentElement.style; r.setProperty("--mx", e.clientX+"px"); r.setProperty("--my", e.clientY+"px"); };
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.addEventListener("pointermove", place, {passive:true});
  render();
}

function blockNav(){ setMsg("You have unsaved changes. Save them, or click Discard.","err"); }
function discard(){ const d = DATA.find(x=>x.id===openId); dirty=false; if(d) renderDetail(d); }

function syncControls(){
  document.querySelectorAll("#states button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.s===S.st));
  const byState = districtsByState();
  const visible = S.st==="All" ? ORDER : [S.st];
  $("#dist").innerHTML = `<option value="All">All districts</option>` + visible.filter(st=>byState[st].length).map(st=>
    `<optgroup label="${esc(st)}">` + byState[st].map(dn=>{ const n=DATA.filter(d=>d.district===dn).length; return `<option value="${esc(dn)}">${esc(dn)} (${n})</option>`; }).join("") + `</optgroup>`).join("");
  if (S.dist!=="All" && !DATA.some(d=>d.district===S.dist && (S.st==="All"||d.state===S.st))) S.dist="All";
  $("#dist").value = S.dist;
  const pms = [...new Set(DATA.flatMap(d=>String(d.pm||"").split(" / ")).filter(Boolean))].sort();
  $("#pm").hidden = pms.length===0;
  $("#pm").innerHTML = `<option value="All">All PMs</option>` + pms.map(p=>`<option>${esc(p)}</option>`).join("");
  $("#pm").value = S.pm;
  $("#stage").value = S.stage;
  $("#q").value = S.q;
}

function filtered({noState=false}={}){
  return DATA.filter(d=>{
    if(!noState && S.st!=="All" && d.state!==S.st) return false;
    if(S.dist!=="All" && d.district!==S.dist) return false;
    if(S.pm!=="All" && !String(d.pm||"").split(" / ").includes(S.pm)) return false;
    if(S.stage!=="All" && stageOf(d)!==S.stage) return false;
    if(S.q){ const hay=[d.district,d.exam,d.program,d.pm,d.it,d.state,d.remark,d.comments].join(" ").toLowerCase(); if(!hay.includes(S.q)) return false; }
    return true;
  });
}

function render(){
  syncControls();
  const rows = filtered();
  const ppt = rows.filter(d=>stageOf(d)==="6 PPT Received").length;
  const nip = rows.filter(d=>d.nipun!=null && d.students!=null);
  const districts = new Set(rows.map(d=>d.district).filter(Boolean)).size;
  const kp = [
    ["Exams", fmt(rows.length), true],
    ["Districts", fmt(districts)],
    ["Schools", fmt(sum(rows,"schools"))],
    ["Students present", fmt(sum(rows,"students"))],
    ["Sheets scanned", fmt(sum(rows,"sheets"))],
    ["Nipun / passed", fmt(sum(rows,"nipun"))],
    ["Nipun %", pct(sum(nip,"nipun"), sum(nip,"students"))],
    ["PPT received", fmt(ppt)],
    ["In progress", fmt(rows.length-ppt)],
  ];
  $("#kpis").innerHTML = kp.map(([l,v,hi])=>`<div class="kpi${hi?" hi":""}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");

  // Stage funnel: counts follow every filter the user has applied.
  const counts = STAGES.map(s=>rows.filter(d=>stageOf(d)===s).length);
  const max = Math.max(1,...counts), total = rows.length;
  $("#funnel").innerHTML = STAGES.map((s,i)=>`<div class="stage-row${S.stage===s?" sel":""}" data-stage="${esc(s)}" tabindex="0" role="button" aria-pressed="${S.stage===s}"><span>${esc(label(s))}</span><span class="t"><i style="width:${(100*counts[i]/max).toFixed(1)}%"></i></span><b>${counts[i]}</b><span class="p">${total? (100*counts[i]/total).toFixed(0)+"% of "+total+" exams" : "no exams in this view"}</span></div>`).join("");

  // By-state table: hidden when a single district is selected.
  const showState = S.dist==="All";
  $("#stateCard").hidden = !showState;
  $("#analysis").classList.toggle("single", !showState);
  if (showState){
    const base = filtered({noState:true});
    const body = ORDER.map(s=>{ const r=base.filter(d=>d.state===s); const p=r.filter(d=>stageOf(d)==="6 PPT Received").length;
      const hi = S.st===s;
      return `<tr style="${hi?"font-weight:600;background:var(--soft)":""}"><td>${s}</td><td class="n">${fmt(r.length)}</td><td class="n">${fmt(sum(r,"schools"))}</td><td class="n">${fmt(sum(r,"students"))}</td><td class="n">${fmt(p)}</td><td class="n">${fmt(r.length-p)}</td></tr>`; }).join("");
    const tp = base.filter(d=>stageOf(d)==="6 PPT Received").length;
    $("#stateTbl").innerHTML = `<tr><th>State</th><th class="n">Exams</th><th class="n">Schools</th><th class="n">Students</th><th class="n">PPT</th><th class="n">In progress</th></tr>` + body +
      `<tr style="font-weight:600"><td>Total</td><td class="n">${fmt(base.length)}</td><td class="n">${fmt(sum(base,"schools"))}</td><td class="n">${fmt(sum(base,"students"))}</td><td class="n">${fmt(tp)}</td><td class="n">${fmt(base.length-tp)}</td></tr>`;
  }

  const ctx = $("#ctx");
  if (S.dist!=="All"){
    ctx.hidden=false;
    ctx.innerHTML = `<div><span class="muted">District</span><br><b>${esc(S.dist)}</b> <span class="muted">· ${esc(stateOfDistrict(S.dist)||"")} · ${rows.length} exam${rows.length===1?"":"s"}</span></div><button class="btn" type="button">Show all districts</button>`;
  } else { ctx.hidden=true; ctx.innerHTML=""; }
  renderRegister();
  if (openId) { const row = DATA.find(x=>x.id===openId); if(row && !dirty) renderDetail(row); }
}

function renderRegister(){
  current = filtered().sort((a,b)=>{
    const k=S.sort; let x = k==="stage" ? stageOf(a) : a[k], y = k==="stage" ? stageOf(b) : b[k];
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="number" && typeof y==="number") return (x-y)*S.dir;
    return String(x).localeCompare(String(y),"en",{numeric:true})*S.dir;
  });
  $("#count").textContent = `${current.length} of ${DATA.length} exams`;
  const cols = [["district","District"],["exam","Exam"],["program","Program"],["stage","Stage"],["examDate","Exam date"],["sheets","Sheets","n"],["students","Students","n"],["it","IT member"]];
  const ar = k => S.sort===k ? (S.dir>0?' <span class="ar">▲</span>':' <span class="ar">▼</span>') : "";
  $("#reg").innerHTML = `<thead><tr>${cols.map(([k,l,c])=>`<th tabindex="0" data-k="${k}" class="${c||""}">${l}${ar(k)}</th>`).join("")}</tr></thead>` +
    (current.length ? "<tbody>" + current.map(d=>{
      const st = stageOf(d);
      return `<tr tabindex="0" data-id="${esc(d.id)}"><td>${esc(d.district||"—")}<div class="muted" style="font-size:12px">${esc(d.state)}</div></td><td>${esc(d.exam||"—")}</td><td>${esc(d.program||"—")}</td><td><span class="pill ${TONE[st[0]]}">${esc(label(st))}</span></td><td>${fdate(d.examDate)||"—"}</td><td class="n">${fmt(d.sheets)}</td><td class="n">${fmt(d.students)}</td><td>${esc(d.it||"—")}</td></tr>`;
    }).join("") + "</tbody>"
    : `<tbody><tr><td colspan="8"><div class="empty">No exams match these filters. <button class="btn" type="button" onclick="document.querySelector('#reset').click()">Reset filters</button></div></td></tr></tbody>`);
  document.querySelectorAll("#reg th[data-k]").forEach(th=>th.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); th.click(); } }));
}

/* ---------- detail + editing ---------- */
function openDetail(id){
  openId = id; dirty = false;
  const d = DATA.find(x=>x.id===id); if(!d) return;
  renderDetail(d);
  const dlg=$("#detail"); if(!dlg.open) dlg.showModal();
  dlg.querySelector(".dbody").scrollTop = 0;
}
function closeDetail(){
  if (dirty){ blockNav(); return; }
  openId=null; $("#detail").close();
}
function renderDetail(d){
  const idx = current.findIndex(x=>x.id===d.id);
  $("#prev").disabled = idx<=0; $("#next").disabled = idx<0 || idx>=current.length-1;
  const st = stageOf(d);
  $("#dtitle").textContent = d.exam || d.program || "Exam";
  $("#dsub").innerHTML = `${esc(d.district||"—")} · ${esc(d.state||"")} · <span class="pill ${TONE[st[0]]}">${esc(label(st))}</span>`;
  const nipPct = (d.nipun!=null && d.students) ? (100*d.nipun/d.students).toFixed(1)+"%" : "—";
  const fact = (l,v,cls="") => `<div class="fact"><div class="l">${l}</div><div class="v ${cls}">${v}</div></div>`;

  const rows = MILESTONES.map(([k,name])=>{
    const v = d[k]; const done = isDone(v);
    const dateVal = (v && v!=="Yes") ? v : "";
    return `<div class="ms-row${done?"":" pend"}">
      <input type="checkbox" id="ck_${k}" data-k="${k}" ${done?"checked":""} aria-label="${esc(name)} done">
      <label class="nm" for="ck_${k}">${name}${done && v==="Yes" ? ' <span class="none">(date not recorded)</span>' : ""}</label>
      <input type="date" id="dt_${k}" data-k="${k}" value="${esc(dateVal)}" aria-label="${esc(name)} date" ${done?"":"disabled"}>
    </div>`;
  }).join("");

  $("#dbody").innerHTML = `
    <section class="dsec"><h4>Progress — tick a step and set its date</h4><div class="ms">${rows}</div></section>
    <section class="dsec"><h4>Remark</h4><textarea id="remark" aria-label="Remark">${esc(d.remark||"")}</textarea></section>
    <div class="savebar">
      <span class="msg" id="msg">Tick or untick steps, then save.</span>
      <span style="display:flex;gap:8px"><button class="btn" id="discard" type="button">Discard</button><button class="btn primary" id="save" type="button">Save changes</button></span>
    </div>
    <section class="dsec"><h4>Counts</h4><div class="facts">
      ${fact("Sheets scanned", fmt(d.sheets))}
      ${fact("Schools", fmt(d.schools))}
      ${fact("Students present", fmt(d.students))}
      ${fact("Nipun / passed", d.nipun!=null?fmt(d.nipun):"—")}
      ${fact("Nipun %", nipPct)}
      ${fact("Clusters", fmt(d.clusters))}
      ${fact("Blocks", fmt(d.blocks))}
    </div></section>
    <section class="dsec"><h4>Exam details</h4><div class="facts">
      ${fact("Program", esc(d.program||"—"),"small")}
      ${fact("Exam name", esc(d.exam||"—"),"small")}
      ${fact("Exam ID", esc(d.examId??"—"),"small")}
      ${fact("PM", d.pm?esc(d.pm):'<span class="missingpm">Not recorded</span>',"small")}
      ${fact("IT member", esc(d.it||"—"),"small")}
    </div></section>
    ${d.comments ? `<section class="dsec"><h4>Comments</h4><div class="note">${esc(d.comments)}</div></section>` : ""}
    <div class="muted" style="font-size:12px">Exam ${idx>=0?idx+1:""} of ${current.length} in the current list. Use ← → keys to move.</div>`;

  // checkbox behaviour: ticking fills today's date if empty; unticking clears it
  $("#dbody").querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener("change", ()=>{
    const k=cb.dataset.k, dt=$("#dt_"+k);
    dt.disabled = !cb.checked;
    if (cb.checked && !dt.value) dt.value = todayISO();
    if (!cb.checked) dt.value = "";
    markDirty();
  }));
  $("#dbody").querySelectorAll('input[type=date],#remark').forEach(el=>el.addEventListener("input", markDirty));
  $("#save").addEventListener("click", ()=>saveExam(d.id));
  $("#discard").addEventListener("click", ()=>discard());
}
function markDirty(){ dirty = true; const m=$("#msg"); if(m){ m.textContent="Unsaved changes."; m.className="msg"; } }

async function saveExam(id){
  const d = DATA.find(x=>x.id===id); if(!d) return;
  const patch = {};
  for (const [k] of MILESTONES){
    const cb = $("#ck_"+k), dt = $("#dt_"+k);
    if (cb.checked) patch[k] = dt.value || (d[k]==="Yes" ? "Yes" : todayISO());
    else patch[k] = null;
  }
  // a later step cannot be done while an earlier one is missing
  const order = MILESTONES.map(([k])=>k);
  for (let i=1;i<order.length;i++){ if(patch[order[i]] && !patch[order[i-1]]){ setMsg("Tick the earlier steps first: a later step needs the step before it.","err"); return; } }
  patch.remark = $("#remark").value.trim() || null;
  const merged = { ...d, ...patch };
  patch.stage = stageOf(merged);
  const btn=$("#save"); btn.disabled=true; setMsg("Saving…","");
  if (!db){ btn.disabled=false; setMsg("Saving is not available in this view. Open the page with access to save.","err"); return; }
  try{
    await db.doc("exams/"+id).update(patch);
    dirty=false; setMsg("Saved. Everyone who opens this page now sees this.","ok");
  }catch(e){
    const code = e && e.code;
    setMsg(code==="permission_denied"||code==="not_granted" ? "You can view this exam but not change it." : "Could not save. Please try again.","err");
  } finally { btn.disabled=false; }
}
function setMsg(text, kind){ const m=$("#msg"); if(m){ m.textContent=text; m.className="msg "+(kind||""); } }

function step(delta){
  if (openId==null) return;
  const idx = current.findIndex(x=>x.id===openId);
  const n = current[idx+delta]; if(!n) return;
  if (dirty){ blockNav(); return; }
  openDetail(n.id);
}

/* ---------- shared data ---------- */
function applyDocs(snap){
  DATA = snap.docs.map(x=>({ ...x.data(), id: x.id }));
  loaded = true; setNotice("");
  render();
}
async function connect(){
  let ns = null;
  try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ ns = null; }
  db = ns;
  if (!db){ setNotice("This view cannot reach the shared exam data, so it cannot show or save exams. Open the page from its link."); return; }
  const timer = setTimeout(()=>{ if(!loaded) setNotice("The shared data is taking a while to load. Please wait; it will appear when it arrives."); }, 10000);
  try{
    db.collection("exams").orderBy("ord").onSnapshot(snap=>{ clearTimeout(timer); applyDocs(snap); }, err=>{
      clearTimeout(timer);
      setNotice("The shared data cannot be read right now. Reload the page later.");
    });
  }catch(e){ clearTimeout(timer); setNotice("The shared data cannot be read right now."); }
}
init();
connect();
</script>

</body></html>
